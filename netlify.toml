# Configurazione di Netlify (hosting di produzione). Vedi /docs/DEPLOY.md.
#
# Il dominio ufficiale (www.elisacastigliegopsicologa.it) è in astro.config.mjs.
# Guida completa alla messa online: /docs/MESSA-ONLINE.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Secrets scanning di Netlify: blocca la build se trova il valore di una
  # variabile d'ambiente nei file del repository o del sito. Queste variabili NON
  # sono segrete e i loro valori compaiono di proposito nel sito (es. l'email
  # di Elisa, il nome utente, la parola "brevo"), quindi vanno escluse. Restano
  # controllate le vere chiavi segrete: ADMIN_BASIC_AUTH_PASS, BREVO_API_KEY,
  # RATE_LIMIT_SALT. Non disattivare del tutto il controllo.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_BASIC_AUTH_USER,MAIL_DRIVER,BREVO_MITTENTE_EMAIL,BREVO_MITTENTE_NOME,DESTINATARIO_EMAIL"

# Modulo di contatto: netlify/functions/contatto.ts (su /api/contatto).
# Protezione di /admin: netlify/edge-functions/proteggi-admin.ts.
# La cartella functions/ in radice contiene invece le Cloudflare Pages Functions:
# qui si indica esplicitamente la cartella di Netlify.
# Il modulo compare sul sito solo quando MAIL_DRIVER=brevo e BREVO_API_KEY sono
# impostate tra le variabili d'ambiente di Netlify (vedi src/lib/modulo-contatto.ts).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Anteprime delle pull request e dei branch: mai indicizzate dai motori di ricerca.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "on"

[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "on"
