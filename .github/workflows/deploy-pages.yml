# Pubblica una copia di anteprima del sito su GitHub Pages a ogni push su main.
# Il sito ufficiale è su Netlify (netlify.toml): questa copia è marcata noindex.
#
# Requisito (una sola volta): su GitHub, Settings → Pages → "Build and deployment"
# → Source: "GitHub Actions" (non "Deploy from a branch", che prova a usare Jekyll
# e fallisce). Vedi /docs/DEPLOY.md.
#
# GitHub Pages è un hosting solo statico: le Cloudflare Pages Functions (modulo di
# contatto, protezione di /admin) e il file _headers (CSP) qui non sono attivi.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configura GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Installa le dipendenze
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_MODULO_CONTATTO: "off"
          # Il sito ufficiale è su Netlify: questa copia non va indicizzata,
          # per non creare contenuti duplicati nei motori di ricerca.
          PUBLIC_NOINDEX: "on"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
