# Configurazione di Sveltia CMS (compatibile con Decap CMS: stesso formato config.yml).
#
# In sviluppo locale (npm run dev) NON servono le righe sul backend GitHub qui sotto:
# su /admin comparirà il pulsante "Lavora con la repository locale" grazie a
# `local_backend: true`, che apre una cartella del progetto direttamente dal browser
# (File System Access API) e legge/scrive i file senza bisogno di credenziali.
#
# In produzione il pulsante "Accedi con GitHub" usa il provider OAuth di Netlify
# (api.netlify.com): va installato una volta in Netlify con una GitHub OAuth App —
# procedura in /docs/CMS.md, "Login con GitHub tramite Netlify".

backend:
  name: github
  repo: "gianluigiribezzo3582-al/DssaCastigliego"
  branch: main
  base_url: "https://api.netlify.com"
  auth_endpoint: "auth"

local_backend: true

site_url: "https://www.elisacastigliegopsicologa.it"
logo_url: "/icon-192.png"

media_folder: "public/immagini-cms"
public_folder: "/immagini-cms"

i18n:
  structure: single_file
  locales: [it]
  default_locale: it

collections:
  - name: "pagine"
    label: "Pagine del sito"
    description: "Titolo e sottotitolo in cima alla home, e i testi per Google."
    files:
      - name: "home"
        label: "Home"
        file: "src/content/pagine/home.md"
        fields:
          - { label: "Titolo per la scheda del browser e per Google", name: "seoTitle", widget: "string" }
          - { label: "Descrizione per Google (massimo 160 caratteri)", name: "seoDescription", widget: "text" }
          - { label: "Titolo grande in home", name: "titolo", widget: "string" }
          - { label: "Sottotitolo in home", name: "sottotitolo", widget: "string" }

  - name: "sezioni"
    label: "Sezioni della home"
    description: "I testi delle tre sezioni: Mi presento, Di cosa mi occupo, La mia formazione. Le foto non si cambiano da qui: vedi la guida."
    files:
      - name: "mi-presento"
        label: "Mi presento"
        file: "src/content/sezioni/mi-presento.md"
        fields:
          - { label: "Titolo della sezione", name: "titolo", widget: "string" }
          - { label: "Ordine (1 = la prima in alto)", name: "ordine", widget: "number", value_type: "int" }
          - { label: "Descrizione della foto per chi non vede (facoltativa)", name: "altFoto", widget: "string", required: false, hint: "Una frase che descrive la foto, letta da chi usa un lettore di schermo. Lasciala vuota se la foto è solo decorativa." }
          - { label: "Didascalia sotto la foto (facoltativa)", name: "didascaliaFoto", widget: "string", required: false, hint: "Es. titolo e autore di un'opera d'arte. Se vuota, non compare nulla." }
          - { label: "Parte della foto da mostrare quando viene ritagliata", name: "allineamentoFoto", widget: "select", options: [{ label: "In alto (es. un ritratto)", value: "alto" }, { label: "Al centro", value: "centro" }, { label: "In basso", value: "basso" }], default: "alto", required: false }
          - { label: "Testo della sezione", name: "body", widget: "markdown" }
      - name: "di-cosa-mi-occupo"
        label: "Di cosa mi occupo"
        file: "src/content/sezioni/di-cosa-mi-occupo.md"
        fields:
          - { label: "Titolo della sezione", name: "titolo", widget: "string" }
          - { label: "Ordine (1 = la prima in alto)", name: "ordine", widget: "number", value_type: "int" }
          - { label: "Descrizione della foto per chi non vede (facoltativa)", name: "altFoto", widget: "string", required: false, hint: "Una frase che descrive la foto, letta da chi usa un lettore di schermo. Lasciala vuota se la foto è solo decorativa." }
          - { label: "Didascalia sotto la foto (facoltativa)", name: "didascaliaFoto", widget: "string", required: false, hint: "Es. titolo e autore di un'opera d'arte. Se vuota, non compare nulla." }
          - { label: "Parte della foto da mostrare quando viene ritagliata", name: "allineamentoFoto", widget: "select", options: [{ label: "In alto (es. un ritratto)", value: "alto" }, { label: "Al centro", value: "centro" }, { label: "In basso", value: "basso" }], default: "alto", required: false }
          - { label: "Testo della sezione", name: "body", widget: "markdown" }
      - name: "la-mia-formazione"
        label: "La mia formazione"
        file: "src/content/sezioni/la-mia-formazione.md"
        fields:
          - { label: "Titolo della sezione", name: "titolo", widget: "string" }
          - { label: "Ordine (1 = la prima in alto)", name: "ordine", widget: "number", value_type: "int" }
          - { label: "Descrizione della foto per chi non vede (facoltativa)", name: "altFoto", widget: "string", required: false, hint: "Una frase che descrive la foto, letta da chi usa un lettore di schermo. Lasciala vuota se la foto è solo decorativa." }
          - { label: "Didascalia sotto la foto (facoltativa)", name: "didascaliaFoto", widget: "string", required: false, hint: "Es. titolo e autore di un'opera d'arte. Se vuota, non compare nulla." }
          - { label: "Parte della foto da mostrare quando viene ritagliata", name: "allineamentoFoto", widget: "select", options: [{ label: "In alto (es. un ritratto)", value: "alto" }, { label: "Al centro", value: "centro" }, { label: "In basso", value: "basso" }], default: "alto", required: false }
          - { label: "Testo della sezione", name: "body", widget: "markdown" }

  - name: "dati_sito"
    label: "Contatti e dati dello studio"
    description: "Email, PEC, località dello studio, iscrizione all'Ordine e numeri utili — usati in tutto il sito."
    files:
      - name: "dati-sito"
        label: "Contatti e dati dello studio"
        file: "src/content/dati-sito.json"
        fields:
          - label: "Contatti"
            name: "contatti"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "PEC", name: "pec", widget: "string" }
              - { label: "Telefono dello studio (lascia vuoto per non mostrarlo)", name: "telefono", widget: "string", required: false }
              - label: "Numero WhatsApp dello studio (lascia vuoto per non mostrarlo; solo cifre, formato internazionale, es. 393331234567)"
                name: "whatsappNumero"
                widget: "string"
                required: false
                pattern: ["^([0-9]{8,15})?$", "Solo cifre, senza + e senza spazi"]

          - label: "Social"
            name: "social"
            widget: "object"
            fields:
              - { label: "Link LinkedIn (facoltativo)", name: "linkedin", widget: "string", required: false }
              - { label: "Link Instagram (facoltativo)", name: "instagram", widget: "string", required: false }

          - { label: "Località dello studio (mostrata al posto dell'indirizzo)", name: "localita", widget: "string" }

          - label: "Iscrizione all'Ordine degli Psicologi"
            name: "albo"
            widget: "object"
            fields:
              - { label: "Regione dell'Ordine", name: "regione", widget: "string" }
              - { label: "Numero di iscrizione", name: "numero", widget: "string" }

          - { label: "Partita IVA", name: "partitaIva", widget: "string" }

          - label: "Informativa privacy"
            name: "informativaPrivacy"
            widget: "object"
            fields:
              - { label: "Numero di versione (es. 1.0)", name: "versione", widget: "string" }
              - { label: "Data ultimo aggiornamento", name: "dataAggiornamento", widget: "string" }

          - label: "Numeri utili in caso di emergenza"
            name: "emergenze"
            widget: "object"
            fields:
              - label: "Elenco numeri di supporto"
                name: "numeriSupporto"
                widget: "list"
                fields:
                  - { label: "Nome del servizio", name: "nome", widget: "string" }
                  - { label: "Numero di telefono", name: "numero", widget: "string" }

  - name: "aspetto"
    label: "Colori del sito"
    description: "La palette del sito. Se un colore non è abbastanza leggibile, il sito usa da solo quello originale (indicato sotto ogni campo)."
    files:
      - name: "tema"
        label: "Colori del sito"
        file: "src/content/tema.json"
        fields:
          - { label: "Sfondo delle pagine", name: "sfondo", widget: "color", allowInput: true, hint: "Colore di fondo principale. Deve restare chiaro. Originale: #fbf6f0" }
          - { label: "Sfondo delle sezioni alternate", name: "sfondoAlternato", widget: "color", allowInput: true, hint: "Fondo di \"Di cosa mi occupo\", della parte alta della home e del piè di pagina. Originale: #f3e9de" }
          - { label: "Testo principale", name: "testo", widget: "color", allowInput: true, hint: "Titoli e paragrafi. Deve restare scuro. Originale: #2e2622" }
          - { label: "Testo secondario", name: "testoSecondario", widget: "color", allowInput: true, hint: "Didascalie, note, testi del piè di pagina. Originale: #5c5049" }
          - { label: "Colore principale", name: "principale", widget: "color", allowInput: true, hint: "Pulsanti, link, numeri delle sezioni, cornice delle foto. Originale: #ac4c2b (terracotta)" }
          - { label: "Colore delle etichette", name: "accento", widget: "color", allowInput: true, hint: "Le piccole scritte in maiuscolo sopra i titoli e nel piè di pagina. Originale: #8a5a1e" }
          - { label: "Linee e bordi", name: "bordi", widget: "color", allowInput: true, hint: "Linee sottili di separazione e bordi dei campi. Originale: #e4d5c6" }
